<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập · GIA HUY</title>
  <link rel="icon" href="../assets/icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/auth.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-hero">
        <h1>Hello, Welcome!</h1>
        <p>Bạn chưa có tài khoản?</p>
        <a class="btn-outline" href="../dang-ky/">Đăng ký</a>
      </div>
      <div class="auth-body">
        <h2>Login</h2>
        <div class="field">
          <input id="username" type="text" autocomplete="username" placeholder="Username" />
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 19.2c1.6-3.1 3.9-4.6 6.5-4.6s4.9 1.5 6.5 4.6"/></svg>
        </div>
        <div class="field">
          <input id="password" type="password" autocomplete="current-password" placeholder="Password" />
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </div>
        <div class="auth-extra">
          <a href="../dang-ky/">Chưa có tài khoản?</a>
        </div>
        <button type="button" class="btn-auth" id="btn-login">Login</button>
        <p class="msg" id="msg" hidden></p>
      </div>
    </div>
    <a class="back-home" href="../">← Về trang chủ GIA HUY</a>
  </div>
  <script src="../assets/membership.js"></script>
  <script>
    (function () {
      var userEl = document.getElementById("username");
      var passEl = document.getElementById("password");
      var msg = document.getElementById("msg");
      function show(ok, text) {
        msg.hidden = !text;
        msg.className = "msg " + (ok ? "ok" : "bad");
        msg.textContent = text || "";
      }
      document.getElementById("btn-login").addEventListener("click", async function () {
        try {
          await GiaHuyMembership.login(userEl.value, passEl.value);
          show(true, "Đăng nhập thành công.");
          location.href = "../";
        } catch (e) {
          show(false, (e && e.message) || "Đăng nhập thất bại.");
        }
      });
      passEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") document.getElementById("btn-login").click();
      });
    })();
  </script>
</body>
</html>
