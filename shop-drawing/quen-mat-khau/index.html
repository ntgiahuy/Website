<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quên mật khẩu · GIA HUY</title>
  <link rel="icon" href="../assets/icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/auth.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-hero">
        <h1>Quên mật khẩu</h1>
        <p>Nhập email đã đăng ký để nhận link đặt lại.</p>
        <a class="btn-outline" href="../dang-nhap/">Login</a>
      </div>
      <div class="auth-body">
        <h2 id="form-title">Reset</h2>

        <div id="step-request">
          <div class="field">
            <input id="email" type="email" autocomplete="email" placeholder="Email" />
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          </div>
          <button type="button" class="btn-auth" id="btn-send">Gửi link đặt lại</button>
        </div>

        <div id="step-reset" hidden>
          <div class="field">
            <input id="password" type="password" autocomplete="new-password" placeholder="Mật khẩu mới" />
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          </div>
          <div class="field">
            <input id="password2" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới" />
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          </div>
          <button type="button" class="btn-auth" id="btn-reset">Đặt mật khẩu mới</button>
        </div>

        <p class="msg" id="msg" hidden></p>
      </div>
    </div>
    <a class="back-home" href="../dang-nhap/">← Về đăng nhập</a>
    <p class="site-copy">Copyright © by <a href="https://giahuy.net" target="_blank" rel="noopener noreferrer">GIAHUY</a></p>
  </div>
  <script src="../assets/membership.js"></script>
  <script>
    (function () {
      var emailEl = document.getElementById("email");
      var passEl = document.getElementById("password");
      var pass2El = document.getElementById("password2");
      var stepReq = document.getElementById("step-request");
      var stepReset = document.getElementById("step-reset");
      var titleEl = document.getElementById("form-title");
      var msg = document.getElementById("msg");
      var resetEmail = "";
      var resetToken = "";

      function show(ok, text) {
        msg.hidden = !text;
        msg.className = "msg " + (ok ? "ok" : "bad");
        msg.textContent = text || "";
      }

      try {
        var q = new URLSearchParams(location.search);
        if (q.get("email") && q.get("token")) {
          resetEmail = q.get("email");
          resetToken = q.get("token");
          emailEl.value = resetEmail;
          stepReq.hidden = true;
          stepReset.hidden = false;
          titleEl.textContent = "Mật khẩu mới";
        }
      } catch (e) {}

      document.getElementById("btn-send").addEventListener("click", async function () {
        try {
          var data = await GiaHuyMembership.passwordResetRequest(emailEl.value);
          show(true, data.message || "Nếu email đã đăng ký, link đã được gửi.");
        } catch (e) {
          show(false, (e && e.message) || "Không gửi được.");
        }
      });

      document.getElementById("btn-reset").addEventListener("click", async function () {
        if (passEl.value !== pass2El.value) {
          show(false, "Hai mật khẩu không khớp.");
          return;
        }
        try {
          var data = await GiaHuyMembership.passwordResetConfirm(resetEmail, resetToken, passEl.value);
          show(true, data.message || "Đã đặt lại mật khẩu.");
          setTimeout(function () { location.href = "../dang-nhap/"; }, 900);
        } catch (e) {
          show(false, (e && e.message) || "Không đặt lại được mật khẩu.");
        }
      });
    })();
  </script>
</body>
</html>
