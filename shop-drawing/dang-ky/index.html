<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng ký · GIA HUY</title>
  <link rel="icon" href="../assets/icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/auth.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-hero">
        <h1>Welcome Back!</h1>
        <p>Đã có tài khoản?</p>
        <a class="btn-outline" href="../dang-nhap/">Login</a>
      </div>
      <div class="auth-body">
        <h2>Register</h2>
        <div class="field">
          <input id="name" type="text" autocomplete="username" placeholder="Username" />
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 19.2c1.6-3.1 3.9-4.6 6.5-4.6s4.9 1.5 6.5 4.6"/></svg>
        </div>
        <div class="field">
          <input id="email" type="email" autocomplete="email" placeholder="Email" />
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        </div>
        <div class="field otp-box" id="otp-box" hidden>
          <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Mã OTP xác nhận email" />
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </div>
        <button type="button" class="btn-auth" id="btn-main">Gửi mã OTP</button>
        <button type="button" class="btn-auth ghost" id="btn-verify" hidden>Hoàn tất đăng ký</button>
        <p class="msg" id="msg" hidden></p>
      </div>
    </div>
    <a class="back-home" href="../">← Về trang chủ GIA HUY</a>
  </div>
  <script src="../assets/membership.js"></script>
  <script>
    (function () {
      var PROFILE_KEY = "giahuy.profile.v1";
      var nameEl = document.getElementById("name");
      var emailEl = document.getElementById("email");
      var otpEl = document.getElementById("otp");
      var otpBox = document.getElementById("otp-box");
      var btnMain = document.getElementById("btn-main");
      var btnVerify = document.getElementById("btn-verify");
      var msg = document.getElementById("msg");
      function show(ok, text) {
        msg.hidden = !text;
        msg.className = "msg " + (ok ? "ok" : "bad");
        msg.textContent = text || "";
      }
      btnMain.addEventListener("click", async function () {
        var name = String(nameEl.value || "").trim();
        if (name.length < 2) {
          show(false, "Nhập username (ít nhất 2 ký tự).");
          return;
        }
        try {
          var data = await GiaHuyMembership.requestOtp(emailEl.value);
          otpBox.hidden = false;
          btnVerify.hidden = false;
          btnMain.textContent = "Đã gửi OTP";
          show(true, data.message || "Đã gửi mã OTP tới email.");
        } catch (e) {
          show(false, (e && e.message) || "Không gửi được OTP.");
        }
      });
      btnVerify.addEventListener("click", async function () {
        try {
          await GiaHuyMembership.verifyOtp(emailEl.value, otpEl.value, "");
          var email = String(emailEl.value || "").trim().toLowerCase();
          var name = String(nameEl.value || "").trim();
          try {
            localStorage.setItem(PROFILE_KEY, JSON.stringify({ email: email, name: name, at: Date.now() }));
          } catch (e) {}
          show(true, "Đăng ký thành công. Tài khoản miễn phí — chờ kích hoạt gói trả phí.");
          setTimeout(function () { location.href = "../"; }, 700);
        } catch (e) {
          show(false, (e && e.message) || "OTP không đúng.");
        }
      });
    })();
  </script>
</body>
</html>
